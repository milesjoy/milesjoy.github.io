<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>龙头挖掘 & 联动板块复盘 - 股比特</title>
  <!-- 引入极易区分 0 与 8 的等宽斜线零/点零字体 (Inconsolata & IBM Plex Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Inconsolata:wght@400;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #0a0e17;
      --bg-surface: #111827;
      --bg-card: #162032;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --accent-cyan: #06b6d4;
      --accent-blue: #38bdf8;
      --accent-purple: #818cf8;
      --accent-gold: #f59e0b;
      --stock-up: #ef4444;
      --stock-up-glow: rgba(239, 68, 68, 0.25);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #64748b;
      --highlight-bg: rgba(6, 182, 212, 0.18);
      --highlight-border: #06b6d4;
      --highlight-text: #38bdf8;
      --active-bg: rgba(239, 68, 68, 0.25);
      --active-border: #ef4444;

      /* 专用清晰数字字体：带明显斜线零(Slashed Zero)，0和8绝不混淆 */
      --font-mono: 'Inconsolata', 'IBM Plex Mono', Consolas, 'SF Mono', Monaco, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      line-height: 1.4;
      overflow-x: hidden;
    }

    /* 强化所有等宽数字显示，强制开启 OpenType 斜线零与等宽排布 */
    .num-font, .stock-code, .stock-price, .time-tag, .amount-text, 
    .volume-text, .lb-badge, .stat-value, .date-header, .rank-col, .pair-code {
      font-family: var(--font-mono) !important;
      font-variant-numeric: slashed-zero tabular-nums !important;
      font-feature-settings: "zero" 1, "tnum" 1 !important;
      letter-spacing: 0.5px;
    }

    .ambient-glow {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 350px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(129, 140, 248, 0.08) 40%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 16px 14px 60px;
      position: relative;
      z-index: 1;
    }

    header { margin-bottom: 16px; }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .logo-area { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #ef4444, #f59e0b);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #fff;
      font-size: 16px;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
    }
    .logo-title h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo-title p { font-size: 11px; color: var(--text-muted); }
    .badge-tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 14px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }
    .stat-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }
    .stat-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 2px; }
    .stat-value { font-size: 18px; font-weight: 700; color: #fff; }
    .stat-value.highlight-red { color: var(--stock-up); text-shadow: 0 0 10px var(--stock-up-glow); }
    .stat-value.highlight-cyan { color: var(--accent-cyan); }
    .stat-value.highlight-gold { color: var(--accent-gold); }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-title .icon-badge {
      font-size: 12px;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
    }
    .card-subtitle { font-size: 11px; color: var(--text-muted); }

    /* 表格 1：龙头挖掘板块矩阵（紧凑型设计） */
    .matrix-wrapper {
      width: 100%;
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: #0d131f;
      -webkit-overflow-scrolling: touch;
    }
    table.matrix-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      min-width: 860px;
      font-size: 12px;
    }
    table.matrix-table th, table.matrix-table td {
      padding: 3px 4px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      white-space: nowrap;
      height: 28px;
    }
    table.matrix-table th {
      background: #141c2c;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 11px;
      padding: 6px 4px;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    table.matrix-table th.date-header {
      color: #cbd5e1;
      cursor: pointer;
    }
    table.matrix-table th.date-header:hover {
      color: var(--accent-cyan);
    }
    table.matrix-table th.date-header.is-latest {
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.12);
      border-bottom: 2px solid var(--accent-cyan);
    }
    table.matrix-table td.rank-col {
      width: 40px;
      background: #141c2c;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 11px;
      position: sticky;
      left: 0;
      z-index: 1;
    }
    .rank-badge {
      display: inline-block;
      width: 18px;
      height: 18px;
      line-height: 18px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.05);
    }
    .rank-1 .rank-badge { background: #ef4444; color: #fff; font-weight: 700; }
    .rank-2 .rank-badge { background: #f97316; color: #fff; }
    .rank-3 .rank-badge { background: #f59e0b; color: #fff; }

    .block-cell {
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 4px;
      transition: all 0.12s ease;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: #e2e8f0;
      font-weight: 500;
      font-size: 12px;
      line-height: 1.2;
    }
    .block-cell:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .block-cell.empty { cursor: default; color: var(--text-muted); background: transparent !important; }

    .block-cell.highlight-same {
      background: var(--highlight-bg) !important;
      border: 1px solid var(--highlight-border) !important;
      color: var(--highlight-text) !important;
      font-weight: 700;
      box-shadow: 0 0 8px rgba(6, 182, 212, 0.35);
    }
    .block-cell.active-selected {
      background: var(--active-bg) !important;
      border: 1px solid var(--active-border) !important;
      color: #fff !important;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.45);
      transform: scale(1.02);
    }

    /* 搜索栏与工具条 */
    .search-box {
      position: relative;
      max-width: 260px;
      width: 100%;
    }
    .search-box input {
      width: 100%;
      background: #0d131f;
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 6px 10px 6px 28px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--accent-cyan); }
    .search-box svg {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 13px;
      height: 13px;
      fill: var(--text-muted);
    }

    /* 表格 2：选中板块个股明细 */
    .detail-table-wrapper {
      width: 100%;
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: #0d131f;
      -webkit-overflow-scrolling: touch;
      max-height: 480px;
      overflow-y: auto;
    }
    table.detail-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 12px;
      min-width: 820px;
    }
    table.detail-table th, table.detail-table td {
      padding: 7px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      white-space: nowrap;
    }
    table.detail-table th {
      background: #141c2c;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      position: sticky;
      top: 0;
      cursor: pointer;
      user-select: none;
      z-index: 2;
    }
    table.detail-table th:hover { color: #fff; }
    table.detail-table tbody tr { transition: background-color 0.12s; }
    table.detail-table tbody tr:hover { background-color: rgba(255, 255, 255, 0.05); }

    .stock-code { color: var(--accent-cyan); font-weight: 700; font-size: 13px; }
    .stock-name { font-weight: 600; color: #fff; }
    .stock-price { font-weight: 700; color: var(--stock-up); font-size: 13px; }

    .lb-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }
    .lb-1 { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .lb-2 { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .lb-3 { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .lb-high {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.3), rgba(168, 85, 247, 0.4));
      color: #ffedd5;
      border: 1px solid #c084fc;
      box-shadow: 0 0 6px rgba(192, 132, 252, 0.4);
    }
    .time-tag { color: var(--text-secondary); font-size: 12px; }
    .amount-text { color: #fca5a5; font-weight: 600; font-size: 12px; }
    .volume-text { color: var(--text-secondary); font-size: 12px; }

    /* 表格 3：当日全部个股多列并排表格 (代码-名称重复列) */
    .summary-grid-wrapper {
      width: 100%;
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: #0d131f;
      -webkit-overflow-scrolling: touch;
    }
    table.summary-multi-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 12px;
    }
    table.summary-multi-table th, table.summary-multi-table td {
      padding: 5px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      white-space: nowrap;
      height: 28px;
    }
    table.summary-multi-table th {
      background: #141c2c;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    table.summary-multi-table tbody tr { transition: background-color 0.12s; }
    table.summary-multi-table tbody tr:hover { background-color: rgba(255, 255, 255, 0.05); }

    .pair-code {
      text-align: center !important;
      width: 90px;
    }
    .pair-name {
      text-align: left !important;
      padding-right: 14px !important;
    }
    .pair-border {
      border-right: 1px solid rgba(255, 255, 255, 0.1) !important;
    }

    .empty-state { padding: 30px; text-align: center; color: var(--text-muted); font-size: 13px; }

    @media (max-width: 768px) {
      .container { padding: 10px 8px 40px; }
      .logo-title h1 { font-size: 16px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
      .stat-card { padding: 8px 10px; }
      .stat-value { font-size: 15px; }
      .card { padding: 10px 8px; margin-bottom: 12px; }
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="container">
    <header>
      <div class="header-top">
        <div class="logo-area">
          <div class="logo-icon">龙</div>
          <div class="logo-title">
            <h1>龙头挖掘 · 联动板块复盘</h1>
            <p>数据源: gubit.cn / 通达信游资复盘系统</p>
          </div>
        </div>
        <div class="header-actions">
          <div class="badge-tag">
            <span class="pulse-dot"></span>
            <span id="update-time-tag">数据已就绪</span>
          </div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">最新交易日</div>
          <div class="stat-value highlight-cyan" id="stat-latest-date">--</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">当前选中板块</div>
          <div class="stat-value" id="stat-selected-block">--</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">选中板块关联股</div>
          <div class="stat-value highlight-red" id="stat-stock-count">0 只</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">当日全部龙头股汇总</div>
          <div class="stat-value highlight-gold" id="stat-day-total-count">0 只</div>
        </div>
      </div>
    </header>

    <!-- 上方表格：龙头挖掘矩阵表格 (紧凑显示，最新日期在最左侧) -->
    <section class="card">
      <div class="card-header">
        <div>
          <div class="card-title">
            <span class="icon-badge">TOP</span>
            龙头挖掘板块矩阵 (近10个交易日)
          </div>
          <div class="card-subtitle">💡 点击任意板块即可联动高亮所有同名板块，并更新下方对应个股及当日汇总</div>
        </div>
      </div>

      <div class="matrix-wrapper">
        <table class="matrix-table" id="matrix-table">
          <thead>
            <tr id="matrix-header-row"></tr>
          </thead>
          <tbody id="matrix-body"></tbody>
        </table>
      </div>
    </section>

    <!-- 中间表格：选中板块的联动涨停个股明细 -->
    <section class="card">
      <div class="card-header">
        <div>
          <div class="card-title">
            <span class="icon-badge">BLOCK</span>
            <span id="detail-table-title">选中板块联动个股明细</span>
          </div>
          <div class="card-subtitle" id="detail-table-subtitle">展示选中板块在指定交易日的涨停连板明细及封单资金</div>
        </div>
        <div class="search-box">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="stock-search-input" placeholder="在当前板块中搜索股票..." />
        </div>
      </div>

      <div class="detail-table-wrapper">
        <table class="detail-table" id="detail-table">
          <thead>
            <tr>
              <th onclick="sortBlockTable('序号')">序号 ⬍</th>
              <th onclick="sortBlockTable('股票代码')">股票代码 ⬍</th>
              <th onclick="sortBlockTable('股票名称')">股票名称 ⬍</th>
              <th onclick="sortBlockTable('现价')">现价 ⬍</th>
              <th onclick="sortBlockTable('涨停时间')">涨停时间 ⬍</th>
              <th onclick="sortBlockTable('连板天数')">连板天数 ⬍</th>
              <th onclick="sortBlockTable('封单金额(元)')">封单金额 ⬍</th>
              <th onclick="sortBlockTable('封单量(股)')">封单量 ⬍</th>
              <th>市场</th>
            </tr>
          </thead>
          <tbody id="detail-table-body"></tbody>
        </table>
      </div>
    </section>

    <!-- 最下方表格：当日全部龙头题材关联个股汇总（仅显示代码和名称，多列横向平铺） -->
    <section class="card">
      <div class="card-header">
        <div>
          <div class="card-title">
            <span class="icon-badge">ALL</span>
            <span id="all-day-title">当日全部龙头题材关联个股汇总</span>
          </div>
          <div class="card-subtitle" id="all-day-subtitle">汇总当前交易日所有入围龙头板块的股票（多列紧凑平铺展示）</div>
        </div>
        <div class="search-box">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="all-day-search-input" placeholder="在当日全部个股中搜索..." />
        </div>
      </div>

      <div class="summary-grid-wrapper">
        <table class="summary-multi-table" id="all-day-multi-table">
          <thead id="all-day-table-head"></thead>
          <tbody id="all-day-table-body"></tbody>
        </table>
      </div>
    </section>

      const latestDate = state.dates[0] || "--";
      document.getElementById("stat-latest-date").textContent = latestDate;

      renderMatrixTable();

      if (state.dates.length > 0 && state.matrix.length > 0) {
        const firstBlockRaw = state.matrix[0][latestDate];
        if (firstBlockRaw) {
          const match = firstBlockRaw.match(/^(.*?)(?:\s*\((\d+)\))?$/);
          const blockName = match ? match[1].trim() : firstBlockRaw;
          const blockId = match && match[2] ? match[2] : "";
          selectBlock(blockName, latestDate, blockId);
        }
      }

      // 绑定搜索框
      document.getElementById("stock-search-input").addEventListener("input", (e) => {
        state.blockSearchKeyword = e.target.value.trim().toLowerCase();
        renderBlockDetailTable();
      });

      document.getElementById("all-day-search-input").addEventListener("input", (e) => {
        state.allDaySearchKeyword = e.target.value.trim().toLowerCase();
        renderAllDayMultiTable();
      });

      window.addEventListener("resize", () => {
        renderAllDayMultiTable();
      });
    });

    // 1. 渲染紧凑型龙头挖掘矩阵表格
    function renderMatrixTable() {
      const headerRow = document.getElementById("matrix-header-row");
      const tbody = document.getElementById("matrix-body");
      
      headerRow.innerHTML = '<th style="width: 40px;">序号</th>';
      state.dates.forEach((d, idx) => {
        const th = document.createElement("th");
        th.className = "date-header" + (idx === 0 ? " is-latest" : "");
        const parts = d.split("-");
        const shortDate = parts.length === 3 ? `${parts[1]}-${parts[2]}` : d;
        th.innerHTML = idx === 0 ? `${shortDate} <span style="font-size:9px; color:#06b6d4;">(最新)</span>` : shortDate;
        
        th.addEventListener("click", () => {
          switchDateSummary(d);
        });

        headerRow.appendChild(th);
      });

      tbody.innerHTML = "";
      state.matrix.forEach((row, rIdx) => {
        const tr = document.createElement("tr");
        const tdRank = document.createElement("td");
        tdRank.className = `rank-col rank-${rIdx + 1}`;
        tdRank.innerHTML = `<span class="rank-badge">${rIdx + 1}</span>`;
        tr.appendChild(tdRank);

        state.dates.forEach((d) => {
          const td = document.createElement("td");
          const rawVal = row[d] || "";

          if (rawVal) {
            const match = rawVal.match(/^(.*?)(?:\s*\((\d+)\))?$/);
            const blockName = match ? match[1].trim() : rawVal;
            const blockId = match && match[2] ? match[2] : "";

            const cellDiv = document.createElement("div");
            cellDiv.className = "block-cell";
            cellDiv.textContent = blockName;
            cellDiv.dataset.blockName = blockName;
            cellDiv.dataset.date = d;
            cellDiv.dataset.blockId = blockId;

            cellDiv.addEventListener("click", () => {
              selectBlock(blockName, d, blockId);
            });

            td.appendChild(cellDiv);
          } else {
            td.innerHTML = '<div class="block-cell empty">--</div>';
          }
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });
    }

    // 2. 选择某个板块与日期
    function selectBlock(blockName, dateStr, blockId) {
      state.selectedBlockName = blockName;
      state.selectedDate = dateStr;
      state.selectedBlockId = blockId;

      document.querySelectorAll(".block-cell").forEach(cell => {
        const cName = cell.dataset.blockName;
        const cDate = cell.dataset.date;
        cell.classList.remove("highlight-same", "active-selected");
        if (cName && cName === blockName) {
          if (cDate === dateStr) {
            cell.classList.add("active-selected");
          } else {
            cell.classList.add("highlight-same");
          }
        }
      });

      state.currentBlockStocks = state.stocks.filter(s => {
        return s["交易日期"] === dateStr && s["板块名称"] === blockName;
      });

      extractDayStocks(dateStr);

      document.getElementById("stat-selected-block").textContent = `${blockName} (${dateStr})`;
      document.getElementById("stat-stock-count").textContent = `${state.currentBlockStocks.length} 只`;
      document.getElementById("stat-day-total-count").textContent = `${state.currentDayStocks.length} 只 (${dateStr})`;

      document.getElementById("detail-table-title").textContent = `【${blockName}】联动涨停个股 (${dateStr})`;
      document.getElementById("detail-table-subtitle").textContent = `共发现 ${state.currentBlockStocks.length} 只涨停标的，点击表头可进行排序`;

      document.getElementById("all-day-title").textContent = `📅 [${dateStr}] 当日全部龙头题材关联个股汇总 (共 ${state.currentDayStocks.length} 只)`;
      document.getElementById("all-day-subtitle").textContent = `汇总当前交易日所有入围龙头板块的股票（多列紧凑平铺展示）`;

      renderBlockDetailTable();
      renderAllDayMultiTable();
    }

    // 切换日期汇总
    function switchDateSummary(dateStr) {
      if (state.matrix.length > 0) {
        const rawVal = state.matrix[0][dateStr];
        if (rawVal) {
          const match = rawVal.match(/^(.*?)(?:\s*\((\d+)\))?$/);
          const blockName = match ? match[1].trim() : rawVal;
          const blockId = match && match[2] ? match[2] : "";
          selectBlock(blockName, dateStr, blockId);
          return;
        }
      }
      state.selectedDate = dateStr;
      extractDayStocks(dateStr);
      renderAllDayMultiTable();
    }

    // 提取当日去重汇总股票
    function extractDayStocks(dateStr) {
      const dayRawList = state.stocks.filter(s => s["交易日期"] === dateStr);
      const stockMap = new Map();

      dayRawList.forEach(s => {
        const code = s["股票代码"];
        if (!stockMap.has(code)) {
          stockMap.set(code, {
            "股票代码": code,
            "股票名称": s["股票名称"] || "--",
            "交易日期": s["交易日期"],
            "连板天数": s["连板天数"]
          });
        }
      });

      state.currentDayStocks = Array.from(stockMap.values());
    }

    // 3. 渲染选中板块个股明细表格
    function renderBlockDetailTable() {
      const tbody = document.getElementById("detail-table-body");
      tbody.innerHTML = "";

      let list = [...state.currentBlockStocks];

      if (state.blockSearchKeyword) {
        list = list.filter(s => {
          const code = (s["股票代码"] || "").toLowerCase();
          const name = (s["股票名称"] || "").toLowerCase();
          return code.includes(state.blockSearchKeyword) || name.includes(state.blockSearchKeyword);
        });
      }

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="empty-state">暂无符合条件的个股记录</td></tr>';
        return;
      }

      list.sort((a, b) => {
        let valA = a[state.blockSortField];
        let valB = b[state.blockSortField];

        if (typeof valA === "number" || typeof valB === "number" || !isNaN(Number(valA))) {
          valA = Number(valA) || 0;
          valB = Number(valB) || 0;
        } else {
          valA = String(valA || "");
          valB = String(valB || "");
        }

        if (valA < valB) return state.blockSortAsc ? -1 : 1;
        if (valA > valB) return state.blockSortAsc ? 1 : -1;
        return 0;
      });

      list.forEach((s, idx) => {
        const tr = document.createElement("tr");
        const lbts = parseInt(s["连板天数"]) || 1;
        let lbClass = "lb-1";
        if (lbts === 2) lbClass = "lb-2";
        else if (lbts >= 3 && lbts < 5) lbClass = "lb-3";
        else if (lbts >= 5) lbClass = "lb-high";

        tr.innerHTML = `
          <td style="color: var(--text-muted); font-family: var(--font-mono);">${idx + 1}</td>
          <td><span class="stock-code">${s["股票代码"]}</span></td>
          <td><span class="stock-name">${s["股票名称"] || "--"}</span></td>
          <td><span class="stock-price">¥ ${s["现价"] || "--"}</span></td>
          <td><span class="time-tag">${s["涨停时间"] || "--"}</span></td>
          <td><span class="lb-badge ${lbClass}">${lbts}连板</span></td>
          <td><span class="amount-text">${s["封单金额(可读)"] || "--"}</span></td>
          <td><span class="volume-text">${s["封单量(可读)"] || "--"}</span></td>
          <td><span style="font-size:11px; color:var(--text-secondary);">${s["市场类型"] || "--"}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 4. 渲染最下方【当日全部个股汇总】（仅保留股票代码和股票名称，多列平铺）
    function renderAllDayMultiTable() {
      const thead = document.getElementById("all-day-table-head");
      const tbody = document.getElementById("all-day-table-body");
      tbody.innerHTML = "";

      let list = [...state.currentDayStocks];

      if (state.allDaySearchKeyword) {
        list = list.filter(s => {
          const code = (s["股票代码"] || "").toLowerCase();
          const name = (s["股票名称"] || "").toLowerCase();
          return code.includes(state.allDaySearchKeyword) || name.includes(state.allDaySearchKeyword);
        });
      }

      let numPairs = 4;
      const width = window.innerWidth;
      if (width < 600) {
        numPairs = 2;
      } else if (width < 960) {
        numPairs = 3;
      } else if (width >= 1300) {
        numPairs = 5;
      }

      let headerHtml = "<tr>";
      for (let p = 0; p < numPairs; p++) {
        const isBorder = (p < numPairs - 1) ? 'pair-border' : '';
        headerHtml += `
          <th class="pair-code">股票代码</th>
          <th class="pair-name ${isBorder}">股票名称</th>
        `;
      }
      headerHtml += "</tr>";
      thead.innerHTML = headerHtml;

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${numPairs * 2}" class="empty-state">当日暂无符合条件的个股</td></tr>`;
        return;
      }

      const numRows = Math.ceil(list.length / numPairs);
      for (let r = 0; r < numRows; r++) {
        const tr = document.createElement("tr");
        let rowHtml = "";

        for (let p = 0; p < numPairs; p++) {
          const idx = r * numPairs + p;
          const isBorder = (p < numPairs - 1) ? 'pair-border' : '';

          if (idx < list.length) {
            const s = list[idx];
            rowHtml += `
              <td class="pair-code"><span class="stock-code">${s["股票代码"]}</span></td>
              <td class="pair-name ${isBorder}"><span class="stock-name">${s["股票名称"]}</span></td>
            `;
          } else {
            rowHtml += `
              <td class="pair-code" style="color:var(--text-muted);">-</td>
              <td class="pair-name ${isBorder}" style="color:var(--text-muted);">-</td>
            `;
          }
        }

        tr.innerHTML = rowHtml;
        tbody.appendChild(tr);
      }
    }

    // 表格排序
    function sortBlockTable(field) {
      if (state.blockSortField === field) {
        state.blockSortAsc = !state.blockSortAsc;
      } else {
        state.blockSortField = field;
        state.blockSortAsc = false;
      }
      renderBlockDetailTable();
    }
  </script>
</body>
</html>
